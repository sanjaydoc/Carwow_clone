name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  clock-tests:
    name: Type-check + epigenetic-clock unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Run clock unit tests
        run: npx --yes tsx@4 --test scripts/clock.test.ts
